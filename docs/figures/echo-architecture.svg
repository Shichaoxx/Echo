<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" role="img" aria-labelledby="title desc">
<title id="title">Echo 0.0 本机架构与 Codex 复盘协作</title>
<desc id="desc">浏览器通过本机 HTTP API 访问 Python Web 服务。服务启动独立的持久队列进程，在同一后台进程中串行执行 FFmpeg 预处理与 MLX 模型推理。原媒体、SQLite 台账、JSON 配置与转写结果保存在本机。用户手动复制当前版本的交接文本给 Codex，Codex 写入约定复盘路径，Echo 刷新后只读展示。交接包含资料库 Memory 入口，经过用户确认后维护长期 Markdown 记忆。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#85898f" stroke-width="1.2"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#29323b} .title{font-size:24px;font-weight:600} .body{font-size:20px} .small{font-size:17px;fill:#65707b} .lane{font-size:18px;font-weight:600;fill:#65707b;letter-spacing:.5px} .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:17px;fill:#65707b} .line{fill:none;stroke:#85898f;stroke-width:1.6;marker-end:url(#arrow)} .both{marker-start:url(#arrow)} </style>
<rect width="1500" height="1090" fill="white"/>
<text x="750" y="49" class="title" text-anchor="middle">选择文件夹  →  回放与转写  →  原文核对  →  Codex 复盘</text>
