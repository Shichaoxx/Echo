<path d="M500 500 V 601" stroke="#d8dde0" stroke-width="1"/>
<path d="M965 500 V 601" stroke="#d8dde0" stroke-width="1"/>
<text x="95" y="518" class="title" text-anchor="start">原始媒体</text>
<text x="95" y="551" class="body" text-anchor="start">用户选择的面试文件夹</text>
<text x="95" y="584" class="small" text-anchor="start">录音 / 录屏保留原处，按需读取</text>
<text x="525" y="518" class="title" text-anchor="start">运行台账与配置</text>
<text x="525" y="551" class="small" text-anchor="start">SQLite WAL：任务、版本、笔记、进度</text>
<text x="525" y="581" class="small" text-anchor="start">JSON：路径、分组与模型偏好</text>
<text x="990" y="518" class="title" text-anchor="start">转写与复盘文件</text>
<text x="990" y="551" class="small" text-anchor="start">transcript.* / audio.mp3 / versions/</text>
<text x="990" y="581" class="small" text-anchor="start">默认：输入文件夹 / echo / 原目录层级</text>
<text x="70" y="685" class="lane" text-anchor="start">02  Codex 协作 · 用户触发的证据交接</text>
<path d="M 450 792 L 550 792" class="line"/>
<text x="500" y="766" class="small" text-anchor="middle">用户复制</text>
<path d="M 930 792 L 1030 792" class="line"/>
<text x="980" y="766" class="small" text-anchor="middle">写入文件</text>
<rect x="70" y="715" width="380" height="160" rx="10" fill="#e9f0f3" stroke="#d4d8dc"/>
<text x="95" y="754" class="title" text-anchor="start">Echo 生成交接文本</text>
<text x="95" y="794" class="small" text-anchor="start">所选版本 · 覆盖范围 · 已保存笔记</text>
<text x="95" y="826" class="body" text-anchor="start">复盘路径 + Memory 入口</text>
<rect x="550" y="715" width="380" height="160" rx="10" fill="#eeeaf5" stroke="#d4d8dc"/>
<text x="575" y="754" class="title" text-anchor="start">Codex 阅读与复盘</text>
<text x="575" y="794" class="small" text-anchor="start">用户在 Codex 中发送交接文本</text>
<text x="575" y="826" class="body" text-anchor="start">核对证据 · 分析回答 · 练习建议</text>
<rect x="1030" y="715" width="380" height="160" rx="10" fill="#eeeaf5" stroke="#d4d8dc"/>
<text x="1055" y="754" class="title" text-anchor="start">复盘与 Memory</text>
<text x="1055" y="794" class="small" text-anchor="start">复盘.md：用户刷新后在 Echo 展示</text>
<text x="1055" y="826" class="small" text-anchor="start">memory/：确认后更新 Markdown</text>
<rect x="70" y="921" width="1340" height="112" rx="8" fill="#f6f7f8" stroke="#e1e4e7"/>
<text x="95" y="952" class="lane" text-anchor="start">存储</text>
<text x="160" y="952" class="small" text-anchor="start">台账默认位于 .local/；Memory 默认位于输出根的 memory/，首次初始化后绑定资料库。</text>
<text x="95" y="982" class="lane" text-anchor="start">机制</text>
<text x="160" y="982" class="small" text-anchor="start">队列与推理在同一后台进程内执行；文件锁保证同一数据目录内串行转写。</text>
<text x="95" y="1012" class="lane" text-anchor="start">边界</text>
<text x="160" y="1012" class="small" text-anchor="start">Echo 不自动调用 Codex；Memory 由用户与 Codex 确认维护，初始化只创建空白骨架。</text>
<text x="750" y="1068" class="small" text-anchor="middle" style="fill:#85898f">Echo 0.0 · 本机架构与复盘协作</text>
</svg>