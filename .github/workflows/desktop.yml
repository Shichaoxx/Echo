name: macOS App build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native development app
        run: python3 scripts/build_macos.py
      - name: Verify bundle signature
        run: codesign --verify --deep --strict dist/Echo.app
