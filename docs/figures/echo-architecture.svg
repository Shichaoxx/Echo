<text x="1244" y="410" class="small" text-anchor="start">结果 / 进度</text>
<rect x="70" y="142" width="380" height="200" rx="10" fill="#e9f0f3" stroke="#d4d8dc"/>
<text x="95" y="181" class="title" text-anchor="start">浏览器工作台</text>
<text x="95" y="221" class="small" text-anchor="start">原生 HTML · CSS · JavaScript</text>
<text x="95" y="253" class="body" text-anchor="start">回放 · 搜索 · 转写版本选择</text>
<text x="95" y="285" class="body" text-anchor="start">笔记与引用 · 主题 · 复盘交接</text>
<text x="95" y="319" class="mono" text-anchor="start">web/</text>
<rect x="550" y="142" width="380" height="200" rx="10" fill="#e9f0f3" stroke="#d4d8dc"/>
<text x="575" y="181" class="title" text-anchor="start">本机 Web 服务</text>
<text x="575" y="221" class="small" text-anchor="start">Python · ThreadingHTTPServer</text>
<text x="575" y="253" class="body" text-anchor="start">文件夹浏览 · 媒体 Range · API</text>
<text x="575" y="285" class="body" text-anchor="start">会话校验 · 笔记修订冲突检查</text>
<text x="575" y="319" class="mono" text-anchor="start">echo/web_service.py · 127.0.0.1</text>
<rect x="1030" y="142" width="380" height="200" rx="10" fill="#fcf0e6" stroke="#d4d8dc"/>
<text x="1055" y="181" class="title" text-anchor="start">后台调度与转写</text>
<text x="1055" y="221" class="small" text-anchor="start">FIFO → FFmpeg → MLX 本地推理</text>
<text x="1055" y="253" class="body" text-anchor="start">Qwen3-ASR / Whisper</text>
<text x="1055" y="285" class="body" text-anchor="start">queue.lock + worker.lock</text>
<text x="1055" y="319" class="mono" text-anchor="start">queue_jobs.py → core.transcribe</text>
<rect x="70" y="438" width="1340" height="189" rx="10" fill="#f6f7f8" stroke="#d4d8dc"/>
